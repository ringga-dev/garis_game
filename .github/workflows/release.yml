name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the manual release (e.g. v1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform 36
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" "platforms;android-36" >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Prepare signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            : "${STORE_PASSWORD:?STORE_PASSWORD secret is required when KEYSTORE_BASE64 is set}"
            : "${KEY_ALIAS:?KEY_ALIAS secret is required when KEYSTORE_BASE64 is set}"
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "store_password=$STORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=${KEY_PASSWORD:-$STORE_PASSWORD}" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secrets found - generating an ephemeral signing key for this build."
            keytool -genkeypair -v -keystore release.jks \
              -storepass garisgame -keypass garisgame \
              -alias garisgame -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Garis Game, OU=Garis, O=Garis Game, L=Indonesia, C=ID" >/dev/null 2>&1
            echo "store_password=garisgame" >> "$GITHUB_OUTPUT"
            echo "key_alias=garisgame" >> "$GITHUB_OUTPUT"
            echo "key_password=garisgame" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.jks" \
            -Pandroid.injected.signing.store.type=jks \
            -Pandroid.injected.signing.store.password='${{ steps.keystore.outputs.store_password }}' \
            -Pandroid.injected.signing.key.alias='${{ steps.keystore.outputs.key_alias }}' \
            -Pandroid.injected.signing.key.password='${{ steps.keystore.outputs.key_password }}'

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          REF=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
          NAME="garis-game-${REF}.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || format('ci-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
